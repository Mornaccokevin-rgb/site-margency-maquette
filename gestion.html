<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion du site — Mairie de Margency</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="assets/site/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=2">
<style>
.muted{color:var(--ink-mute)}
.view{animation:viewIn .45s var(--ease) both}
@keyframes viewIn{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}

/* ============ en-tête ============ */
.g-top{position:sticky; top:0; z-index:100; padding-top:14px}
.g-bar{display:flex; align-items:center; gap:1rem; padding:.5rem .55rem .5rem 1.1rem; border-radius:var(--r-pill)}
.g-bar .brand-txt span{color:var(--brand); font-weight:600}
.tabs{display:flex; gap:.15rem; margin-left:auto; overflow-x:auto; scrollbar-width:none; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch}
.tab{display:flex; align-items:center; gap:.45rem; padding:.58rem .8rem; border-radius:var(--r-pill); white-space:nowrap;
  font-size:.85rem; font-weight:500; color:var(--ink-soft); transition:.3s}
.tab svg{width:16px;height:16px;flex:none}
.tab:hover{background:rgba(255,255,255,.6); color:var(--ink)}
.tab.on{background:#fff; color:var(--ink); box-shadow:0 4px 14px rgba(9,42,54,.1)}

.g-main{padding:18px 0 90px}
.etat{display:flex; align-items:center; gap:.7rem; flex-wrap:wrap; padding:.7rem 1.1rem; border-radius:var(--r-sm); font-size:.84rem; margin-bottom:22px;
  background:rgba(220,252,231,.6); border:1px solid rgba(22,163,74,.25); color:#14532d}
.etat.ko{background:rgba(254,215,170,.55); border-color:rgba(234,88,12,.25); color:#7c2d12}
.etat svg{width:17px;height:17px;flex:none}
.etat code{font-size:.8rem; padding:.15rem .45rem; border-radius:6px; background:rgba(11,26,36,.08)}

.h-row{display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; flex-wrap:wrap; margin-bottom:18px}
.h-row h1{font-size:clamp(1.7rem,2.8vw,2.3rem); letter-spacing:-.03em; margin-top:.5rem}
.h-row p{color:var(--ink-soft); margin-top:.35rem; max-width:64ch}

/* ============ tableau de bord ============ */
.dash{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px}
.tuile{display:flex; flex-direction:column; gap:.3rem; padding:20px; border-radius:var(--r-md)}
.tuile .t-top{display:flex; align-items:center; justify-content:space-between}
.pastille{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;flex:none;
  background:linear-gradient(145deg,var(--c1),var(--c2)); box-shadow:0 8px 20px rgba(9,42,54,.16), inset 0 1px 0 rgba(255,255,255,.35)}
.pastille svg{width:22px;height:22px}
.pastille.sm{width:36px;height:36px;border-radius:11px}
.pastille.sm svg{width:17px;height:17px}
.tuile b.n{font-size:2rem; letter-spacing:-.04em; line-height:1}
.tuile h3{font-size:1.05rem; margin-top:.6rem}
.tuile p{font-size:.84rem; color:var(--ink-soft)}
.tuile .t-act{display:flex; gap:.5rem; flex-wrap:wrap; margin-top:auto; padding-top:.9rem}
.bloc{padding:22px 24px; border-radius:var(--r-lg); margin-top:18px}
.bloc h2{font-size:1.1rem; margin-bottom:.9rem}
.histo{display:grid; gap:6px; font-size:.84rem; color:var(--ink-soft)}
.histo div{display:flex; gap:.8rem; padding:.45rem .7rem; border-radius:10px; background:rgba(255,255,255,.45)}
.histo b{color:var(--ink); min-width:110px}

/* ============ listes ============ */
.outils{display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; margin-bottom:14px}
.recherche{flex:1; min-width:220px; display:flex; align-items:center; gap:.6rem; padding:.2rem .4rem .2rem 1rem; border-radius:var(--r-pill)}
.recherche svg{width:17px;height:17px;color:var(--ink-mute);flex:none}
.recherche input{flex:1; border:0; background:transparent; padding:.65rem 0; font-size:.94rem; outline:none}
.filtre{display:flex; gap:4px; padding:4px; border-radius:var(--r-pill)}
.filtre button{border:0; background:transparent; padding:.5rem .9rem; border-radius:var(--r-pill); font-size:.84rem; font-weight:600; color:var(--ink-soft); cursor:pointer}
.filtre button.on{background:#fff; color:var(--ink); box-shadow:0 4px 12px rgba(9,42,54,.1)}
.liste{display:grid; gap:8px}
.ligne{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:1rem; align-items:center; padding:10px 12px; border-radius:18px;
  transition:transform .35s var(--ease), box-shadow .35s var(--ease)}
.ligne:hover{transform:translateY(-2px); box-shadow:0 14px 30px rgba(9,42,54,.12), var(--glass-inner)}
.vign{width:74px; height:56px; border-radius:12px; object-fit:cover; background:linear-gradient(145deg,#cfe6e3,#9cc9c4); flex:none}
.date-pas{width:62px; text-align:center; padding:8px 0; border-radius:14px; color:#fff; background:linear-gradient(155deg,#1b8f86,#0b5f58)}
.date-pas.vi{background:linear-gradient(155deg,#8b5cf6,#6d28d9)}
.date-pas b{display:block; font-size:1.35rem; line-height:1}
.date-pas span{font-size:.68rem; font-weight:600}
.ligne h3{font-size:.98rem; line-height:1.3}
.ligne small{display:block; font-size:.8rem; color:var(--ink-mute); margin-top:.2rem}
.badge{display:inline-block; font-size:.68rem; font-weight:700; padding:.12rem .5rem; border-radius:var(--r-pill); margin-left:.4rem; vertical-align:middle;
  background:rgba(15,118,110,.12); color:#0b5f58}
.badge.passe{background:rgba(11,26,36,.07); color:var(--ink-mute)}
.actions{display:flex; gap:.35rem}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid rgba(11,26,36,.08);background:rgba(255,255,255,.6);cursor:pointer;color:var(--ink-soft);transition:.25s}
.ib:hover{background:#fff; color:var(--brand)}
.ib.del:hover{color:var(--danger)}
.ib svg{width:17px;height:17px}
.ib:disabled{opacity:.35; cursor:not-allowed}
.vide{padding:40px; text-align:center; color:var(--ink-mute); border-radius:var(--r-lg)}

/* ============ formulaires ============ */
.form{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:18px; align-items:start}
.carte-f{padding:26px 28px; border-radius:var(--r-lg)}
.carte-f + .carte-f{margin-top:18px}
.carte-f h2{font-size:1.05rem; display:flex; align-items:center; gap:.6rem; margin-bottom:1rem}
.carte-f h2 i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.78rem;color:#fff;background:linear-gradient(145deg,#14b8a6,#0f766e)}
.carte-f .aide{font-size:.8rem; color:var(--ink-mute); margin:-.6rem 0 1rem}
.pile{display:grid; gap:14px}
.field textarea{min-height:90px; resize:vertical; line-height:1.5}
.req{color:var(--danger)}
.barre-bas{position:fixed; left:0; right:0; bottom:0; z-index:90; padding:12px 0; background:rgba(238,244,243,.78);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-top:1px solid rgba(11,26,36,.08)}
.barre-bas .wrap{display:flex; gap:.6rem; align-items:center; justify-content:flex-end; flex-wrap:wrap}
.barre-bas .info{margin-right:auto; font-size:.84rem; color:var(--ink-soft)}

/* éditeur de texte */
.editeur{border-radius:12px; border:1px solid rgba(11,26,36,.12); background:rgba(255,255,255,.66); overflow:hidden}
.editeur:focus-within{border-color:rgba(15,118,110,.55); box-shadow:0 0 0 4px rgba(15,118,110,.14); background:#fff}
.ed-outils{display:flex; gap:2px; flex-wrap:wrap; padding:6px; border-bottom:1px solid rgba(11,26,36,.08); background:rgba(255,255,255,.5)}
.ed-outils button{border:0; background:transparent; min-width:34px; height:32px; padding:0 .55rem; border-radius:8px; cursor:pointer; font-size:.84rem; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; gap:.35rem}
.ed-outils button:hover{background:rgba(15,118,110,.1); color:var(--brand)}
.ed-outils button svg{width:16px;height:16px}
.ed-outils .sep{width:1px; background:rgba(11,26,36,.1); margin:4px 4px}
.ed-zone{min-height:220px; max-height:520px; overflow:auto; padding:14px 16px; outline:none; font-size:.94rem; line-height:1.65}
.ed-zone a{color:var(--brand); text-decoration:underline}
.ed-zone h3{font-size:1.1rem; margin:.6rem 0 .3rem}
.ed-zone p{margin:0 0 .6rem}

/* image & fichier */
.media{display:grid; grid-template-columns:150px minmax(0,1fr); gap:14px; align-items:start}
.media .apercu{width:150px; aspect-ratio:4/3; border-radius:14px; object-fit:cover; background:linear-gradient(145deg,#cfe6e3,#9cc9c4)}
.fichier{display:flex; gap:.5rem; align-items:center; flex-wrap:wrap}
.fichier input[type=text]{flex:1; min-width:160px}
.fichier .etiq{font-size:.78rem; color:var(--ink-mute)}
input[type=file]{display:none}

/* étiquettes */
[data-tags] .check-pill{white-space:nowrap}
.form > div:last-child .media{grid-template-columns:minmax(0,1fr)}
.form > div:last-child .media .apercu{width:100%; aspect-ratio:16/10}
.tags-new{display:flex; gap:.5rem; margin-top:.6rem}
.tags-new input{flex:1}

/* blocs répétables */
.rep{display:grid; gap:10px}
.rep-item{padding:14px; border-radius:16px; background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.8)}
.rep-head{display:flex; align-items:center; gap:.6rem; margin-bottom:.7rem}
.rep-head b{font-size:.86rem}
.rep-head .actions{margin-left:auto}
.rep-head .ib{width:32px;height:32px;border-radius:10px}
.rep-head .ib svg{width:15px;height:15px}
.ajouter{border:1.5px dashed rgba(15,118,110,.35); background:rgba(255,255,255,.35); border-radius:14px; padding:.8rem; font-weight:600; color:var(--brand); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:.5rem; font-size:.88rem; transition:.25s}
.ajouter:hover{background:rgba(255,255,255,.7)}
.ajouter svg{width:17px;height:17px}

/* présences */
.pres{display:grid; gap:6px}
.pres-l{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.6rem; align-items:center; padding:6px 10px; border-radius:12px; background:rgba(255,255,255,.45)}
.pres-l span{font-size:.86rem}
.pres-l small{color:var(--ink-mute); font-size:.74rem}
.seg3{display:flex; gap:3px; padding:3px; border-radius:var(--r-pill); background:rgba(11,26,36,.06)}
.seg3 label{cursor:pointer}
.seg3 input{display:none}
.seg3 span{display:block; padding:.3rem .65rem; border-radius:var(--r-pill); font-size:.76rem; font-weight:600; color:var(--ink-soft)}
.seg3 input:checked + span{background:#fff; color:var(--ink); box-shadow:0 2px 8px rgba(9,42,54,.12)}
.seg3 input[value=present]:checked + span{color:#15803d}
.seg3 input[value=absent]:checked + span{color:#b91c1c}
.pres-l > span{min-width:0; overflow-wrap:anywhere}
.pres-l > span small{display:block; line-height:1.3}
.pouvoir{grid-column:1 / -1; display:flex; align-items:center; gap:.5rem; font-size:.8rem; color:var(--ink-soft)}
.pouvoir select{padding:.35rem .5rem; border-radius:8px; border:1px solid rgba(11,26,36,.12); background:#fff; font-size:.8rem}

/* sélecteur d'icônes et de couleurs */
.icones{display:grid; grid-template-columns:repeat(auto-fill,minmax(40px,1fr)); gap:6px; max-height:170px; overflow:auto; padding:2px}
.icones button{height:40px; border-radius:11px; border:1px solid rgba(11,26,36,.08); background:rgba(255,255,255,.6); cursor:pointer; display:grid; place-items:center; color:var(--ink-soft)}
.icones button svg{width:18px;height:18px}
.icones button.on{background:linear-gradient(145deg,var(--c1),var(--c2)); color:#fff; border-color:transparent}
.teintes{display:flex; gap:8px; flex-wrap:wrap}
.teintes button{width:32px;height:32px;border-radius:50%;border:3px solid #fff;cursor:pointer;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 2px 8px rgba(9,42,54,.18)}
.teintes button.on{outline:3px solid var(--ink); outline-offset:1px}

/* aperçu de carte */
.apercu-carte{display:flex; gap:.9rem; align-items:flex-start; padding:16px; border-radius:18px; background:rgba(255,255,255,.7); border:1px solid rgba(255,255,255,.9)}
.apercu-carte b{display:block; font-size:.93rem}
.apercu-carte span.t{display:block; font-size:.82rem; color:var(--ink-soft); margin-top:.2rem}
.apercu-carte span.go{display:block; color:#6d28d9; font-weight:600; font-size:.82rem; margin-top:.4rem}

/* sélecteur de lien */
.lien-f{display:grid; gap:8px}
.lien-f .dest{font-size:.78rem; color:var(--ink-mute); word-break:break-all}
.lien-f .dest a{color:var(--brand)}

/* zones (cartes) */
.zones{display:grid; grid-template-columns:260px minmax(0,1fr); gap:18px; align-items:start}
.zone-nav{padding:10px; border-radius:var(--r-md); display:grid; gap:4px; position:sticky; top:96px}
.zone-nav button{text-align:left; border:0; background:transparent; padding:.7rem .85rem; border-radius:14px; cursor:pointer; transition:.25s}
.zone-nav button b{display:block; font-size:.88rem}
.zone-nav button small{display:block; font-size:.74rem; color:var(--ink-mute)}
.zone-nav button:hover{background:rgba(255,255,255,.55)}
.zone-nav button.on{background:#fff; box-shadow:0 4px 14px rgba(9,42,54,.1)}
.zone-nav h4{font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-mute); padding:.6rem .85rem .2rem}

@media (max-width:1100px){
  .form{grid-template-columns:minmax(0,1fr)}
  .dash{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .zones{grid-template-columns:minmax(0,1fr)}
  .zone-nav{position:static}
  .tab span{display:none}
}
@media (max-width:760px){
  .g-bar{flex-wrap:wrap; border-radius:var(--r-lg); padding:.7rem}
  /* la barre déborde : un dégradé sur le bord droit dit qu'elle défile */
  .tabs{margin-left:0; width:100%; scrollbar-width:thin;
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);
            mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .dash{grid-template-columns:minmax(0,1fr)}
  .carte-f{padding:20px 18px}
  .media{grid-template-columns:minmax(0,1fr)}
  .ligne{grid-template-columns:auto minmax(0,1fr)}
  .ligne .actions{grid-column:1 / -1; justify-content:flex-end}
}
</style>
</head>
<body>

<div class="aurora">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="blob b3"></div><div class="blob b4"></div>
</div>
<div class="grain"></div>

<div class="g-top">
  <div class="wrap">
    <div class="g-bar glass">
      <a class="brand" href="index.html" title="Retour au site">
        <img class="blason" src="assets/site/blason-128.webp" width="40" height="44" alt="Blason de Margency" style="height:42px">
        <span class="brand-txt"><strong>Margency</strong><span>Gestion du site</span></span>
      </a>
      <nav class="tabs" tabindex="0" aria-label="Sections de la gestion" id="tabs" aria-label="Sections"></nav>
    </div>
  </div>
</div>

<main class="g-main">
  <div class="wrap">
    <div class="etat" id="etat" hidden></div>
    <div id="app"></div>
  </div>
</main>

<input type="file" id="choixFichier" aria-label="Choisir un fichier sur l'ordinateur" tabindex="-1">

<script src="js/icones.js"></script>
<script src="data/accueil.js"></script>
<script src="data/agenda.js"></script>
<script src="data/actus.js"></script>
<script src="data/conseil.js"></script>
<script src="data/ccas.js"></script>
<script src="data/cartes.js"></script>
<script src="data/services.js"></script>
<script src="data/vie-municipale.js"></script>
<script src="data/enfance.js"></script>
<script src="data/culture.js"></script>
<script src="data/vivre.js"></script>
<script src="data/urbanisme.js"></script>
<script src="js/compte-demo.js"></script>
<script>
(function(){
  var app = document.getElementById('app'), esc = MD.esc, toast = MD.toast, modal = MD.modal;
  var ICONES = window.ICONES, TEINTES = window.TEINTES, TODAY = MD.AUJOURDHUI;

  /* ============================================================
     DONNÉES & ENREGISTREMENT
     ============================================================ */
  var D = {accueil:window.ACCUEIL, agenda:window.AGENDA, actus:window.ACTUS, conseil:window.CONSEIL, ccas:window.CCAS, cartes:window.CARTES, services:window.SERVICES, vie:window.VIE, enfance:window.ENFANCE, culture:window.CULTURE, vivre:window.VIVRE, urbanisme:window.URBA};
  var serveurOk = false;

  function ico(n){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(ICONES[n] || MD.svg(n).replace(/^<svg[^>]*>|<\/svg>$/g, ''))+'</svg>'; }
  function copie(o){ return JSON.parse(JSON.stringify(o)); }

  function verifierServeur(){
    return fetch('/api/etat', {cache:'no-store'}).then(function(r){ return r.json(); })
      .then(function(j){ serveurOk = !!j.ok; }).catch(function(){ serveurOk = false; })
      .then(afficherEtat);
  }
  function afficherEtat(){
    var el = document.getElementById('etat');
    el.hidden = false;
    el.className = 'etat' + (serveurOk ? '' : ' ko');
    el.innerHTML = serveurOk
      ? ico('check') + '<span><b>Enregistrement activé.</b> Chaque modification est écrite dans les fichiers du site ; l\'ancienne version est gardée dans <code>data/historique</code>.</span>'
      : ico('info') + '<span><b>Lecture seule.</b> Pour enregistrer, ouvrez le Terminal dans le dossier du site et lancez <code>python3 serveur.py</code>, puis rechargez cette page depuis <code>http://localhost:8766/gestion.html</code>.</span>';
  }

  /* enregistre un fichier entier ; en cas d'échec, restaure l'état précédent */
  function enregistrer(fichier, avant){
    var cle = fichier === 'vie-municipale' ? 'vie' : fichier;
    if(!serveurOk){
      if(avant !== undefined) D[cle] = avant;
      modal('<h3>Enregistrement impossible</h3><p style="margin-top:.8rem;color:var(--ink-soft)">Le serveur de gestion n\'est pas lancé. Dans le Terminal, depuis le dossier <b>mairie-de-margency</b> :</p><pre>python3 serveur.py</pre><p style="margin-top:.8rem;color:var(--ink-soft)">Puis ouvrez <b>http://localhost:8766/gestion.html</b>.</p><div class="modal-actions"><button class="btn btn-solid" data-close>Compris</button></div>');
      return Promise.reject(new Error('serveur'));
    }
    return fetch('/api/enregistrer', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({fichier:fichier, donnees:D[cle]})})
      .then(function(r){ return r.json(); })
      .then(function(j){ if(!j.ok) throw new Error(j.erreur || 'Erreur'); })
      .catch(function(e){
        if(avant !== undefined) D[cle] = avant;
        if(e.message !== 'serveur') toast('Échec de l\'enregistrement : ' + e.message);
        throw e;
      });
  }

  /* dépôt d'une image ou d'un PDF dans assets/uploads */
  function deposer(accept){
    return new Promise(function(resolve, reject){
      if(!serveurOk){ enregistrer().catch(function(){}); return reject(new Error('serveur')); }
      var inp = document.getElementById('choixFichier');
      inp.value = ''; inp.accept = accept;
      inp.onchange = function(){
        var f = inp.files[0]; if(!f) return;
        var lecteur = new FileReader();
        lecteur.onload = function(){
          toast('Envoi de « ' + f.name + ' »…');
          fetch('/api/deposer', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({nom:f.name, contenu:lecteur.result})})
            .then(function(r){ return r.json(); })
            .then(function(j){ if(!j.ok) throw new Error(j.erreur); resolve(j); })
            .catch(function(e){ toast(e.message); reject(e); });
        };
        lecteur.readAsDataURL(f);
      };
      inp.click();
    });
  }

  /* ============================================================
     OUTILS : dates, identifiants
     ============================================================ */
  var MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  var MOIS_C = ['Janv','Févr','Mars','Avril','Mai','Juin','Juil','Août','Sept','Oct','Nov','Déc'];
  function dateTexte(iso, majuscule){
    if(!iso) return '';
    var p = iso.split('-'), m = MOIS[+p[1]-1];
    if(majuscule) m = m.charAt(0).toUpperCase() + m.slice(1);
    return (+p[2]) + ' ' + m + ' ' + p[0];
  }
  function datePastille(iso, cls){
    var p = (iso || '----').split('-');
    return '<span class="date-pas '+(cls||'')+'"><b>'+(+p[2] || '?')+'</b><span>'+(MOIS_C[+p[1]-1] || '')+' '+p[0]+'</span></span>';
  }
  function slugifier(t){
    return (t || 'sans-titre').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 80) || 'sans-titre';
  }

  /* champ « lien » : une page du site, ou une adresse web, ou rien */
  function champLien(nom, valeur, facultatif){
    var interne = false, opts = destinations().map(function(gr){
      return '<optgroup label="'+esc(gr[0])+'">' + gr[1].map(function(o){
        var sel = o[0] === valeur ; if(sel) interne = true;
        return '<option value="'+esc(o[0])+'"'+(sel ? ' selected' : '')+'>'+esc(o[1])+'</option>';
      }).join('') + '</optgroup>';
    }).join('');
    var mode = !valeur ? (facultatif === false ? 'site' : 'aucun') : interne ? 'site' : 'web';
    return '<div class="lien-f" data-lien="'+nom+'">'+
      '<div class="seg3" style="align-self:start">'+
        (facultatif !== false ? '<label><input type="radio" name="mode-'+nom+'" value="aucun"'+(mode==='aucun'?' checked':'')+'><span>Pas de lien</span></label>' : '')+
        '<label><input type="radio" name="mode-'+nom+'" value="site"'+(mode==='site'?' checked':'')+'><span>Une page du site</span></label>'+
        '<label><input type="radio" name="mode-'+nom+'" value="web"'+(mode==='web'?' checked':'')+'><span>Un site internet</span></label>'+
      '</div>'+
      '<label class="field" data-m="site"'+(mode==='site'?'':' hidden')+'><span>Page de destination</span><select data-k="site">'+opts+'</select></label>'+
      '<label class="field" data-m="web"'+(mode==='web'?'':' hidden')+'><span>Adresse du site</span><input type="url" data-k="web" placeholder="https://…" value="'+(mode==='web' ? esc(valeur) : '')+'"></label>'+
      '<div class="dest" data-dest></div>'+
    '</div>';
  }
  function lireLien(racine, nom){
    var b = racine.querySelector('[data-lien="'+nom+'"]');
    var m = b.querySelector('input[name="mode-'+nom+'"]:checked');
    m = m ? m.value : 'site';
    if(m === 'site') return b.querySelector('[data-k=site]').value;
    if(m === 'web'){ var v = b.querySelector('[data-k=web]').value.trim(); return v && !/^(https?:|mailto:|tel:)/.test(v) ? 'https://' + v : v; }
    return '';
  }
  function brancherLiens(racine, onChange){
    racine.querySelectorAll('[data-lien]').forEach(function(b){
      var nom = b.dataset.lien;
      function maj(){
        var m = (b.querySelector('input[name="mode-'+nom+'"]:checked') || {}).value || 'site';
        b.querySelectorAll('[data-m]').forEach(function(x){ x.hidden = x.dataset.m !== m; });
        var v = lireLien(racine, nom);
        b.querySelector('[data-dest]').innerHTML = v ? 'Destination : <a href="'+esc(v)+'" target="_blank" rel="noopener">'+esc(v)+'</a> (s\'ouvre dans un nouvel onglet)' : '';
        if(onChange) onChange();
      }
      b.addEventListener('change', maj); b.addEventListener('input', maj); maj();
    });
  }

  function brancherEditeurs(racine){

      var zone = ed.querySelector('.ed-zone'), plage = null;
      document.execCommand('defaultParagraphSeparator', false, 'p');
      zone.addEventListener('blur', function(){ var s = getSelection(); if(s.rangeCount) plage = s.getRangeAt(0); });
      ed.querySelector('.ed-outils').addEventListener('mousedown', function(e){ if(e.target.closest('button')) e.preventDefault(); });
      ed.querySelector('.ed-outils').addEventListener('click', function(e){
        var b = e.target.closest('button'); if(!b) return;
        var c = b.dataset.cmd;
        if(c === 'h3' || c === 'p'){ document.execCommand('formatBlock', false, c); return; }
        if(c !== 'lien'){ document.execCommand(c); return; }
        var s = getSelection(), r = s.rangeCount && zone.contains(s.anchorNode) ? s.getRangeAt(0) : plage;
        if(!r || r.collapsed){ toast('Sélectionnez d\'abord le texte à transformer en lien'); return; }
        var m = modal('<h3>Ajouter un lien</h3><p style="color:var(--ink-soft);margin:.5rem 0 1rem">Sur « '+esc(r.toString().slice(0,80))+' »</p>'+champLien('ed', '', false)+

        });
      });
    });

  function formCol(espace, cle, index, apres){
    var ES = ESPACES[espace], C = ES.cols[cle], x = index > -1 ? listeCol(ES, cle)[index] : {};
    if(index === -1){ C.champs.forEach(function(c){ if(c[2] === 'date' && c[3]) x[c[0]] = TODAY ; if(c[2] === 'liste') x[c[0]] = c[4][0][0]; }); }
    var html = C.champs.map(function(c){
      var k = c[0], label = c[1] + (c[3] ? ' <span class="req">*</span>' : '');
      switch(c[2]){
        case 'date':  return champ(label, inp(k, x[k], 'type="date"'));
        case 'url':   return champ(label, inp(k, x[k], 'type="url" placeholder="https://…"'));
        case 'liste': return champ(label, sel(k, x[k], c[4]));
        case 'zone':  return champ(label, txt(k, x[k], 'rows="4"'));
        case 'etapes': return champ(label, txt(k, (x[k] || []).map(function(e){ return e[0] + ' = ' + e[1]; }).join('\n'), 'rows="6" placeholder="Mars 2027 = Début des travaux"'), 'Une étape par ligne : période = ce qui se passe');
        case 'images': return champ(label, txt(k, (x[k] || []).join('\n'), 'rows="2" placeholder="assets/…/photo.jpg"'), 'Une adresse d\'image par ligne (ou déposez-les avec le champ image puis copiez l\'adresse)');
        case 'image': return '<div class="field"><span>'+label+'</span>'+champImage(k, x[k])+'</div>';
        case 'doc':   var u = k === 'fichier' ? {url:x.url, taille:x.taille} : {url:x[k]}; return '<div class="field"><span>'+label+'</span>'+champDoc('d-'+k, u)+'</div>';
        case 'docs':  return '<div class="field"><span>'+label+'</span><div class="rep" data-docs>'+(x[k] || []).map(blocDocCcas).join('')+'</div>'+
                        '<button type="button" class="ajouter" data-ajout-doc style="margin-top:8px">'+ico('plus')+'Ajouter un document</button></div>';
        default:      return champ(label, inp(k, x[k], c[4] ? 'placeholder="'+esc(c[4])+'"' : ''));
      }
    }).join('');
    var m = modal('<h3>'+(index > -1 ? 'Modifier' : C.ajout)+'</h3><p style="color:var(--ink-soft);margin:.3rem 0 1.2rem;font-size:.9rem">'+C.nom+'</p><div class="pile">'+html+'</div>'+
      '<div class="modal-actions"><button class="btn btn-glass" data-close>Annuler</button><button class="btn btn-solid" data-ok>'+ico('save')+'Enregistrer</button></div>');
    m.el.querySelector('.modal-card').style.width = 'min(100%, 760px)';
    m.el.querySelectorAll('.media').forEach(function(me){ me.style.gridTemplateColumns = '140px 1fr'; });
    brancherImages(m.el); brancherDocs(m.el);
    m.el.addEventListener('click', function(e){
      if(e.target.closest('[data-ajout-doc]')) m.el.querySelector('[data-docs]').insertAdjacentHTML('beforeend', blocDocCcas());
      var r = e.target.closest('[data-retirer]'); if(r) r.closest('.rep-item').remove();
      var mo = e.target.closest('[data-monter]'); if(mo){ var it = mo.closest('.rep-item'); if(it.previousElementSibling) it.parentNode.insertBefore(it, it.previousElementSibling); }
    });
    m.el.querySelector('[data-ok]').addEventListener('click', function(){
      var manque = [], y = index > -1 ? copie(x) : {};
      C.champs.forEach(function(c){
        var k = c[0], v;
        if(c[2] === 'doc'){
          var d = lireDoc(m.el, 'd-' + k);
          if(k === 'fichier'){ y.url = d ? d.url : ''; y.taille = d ? d.taille : ''; v = y.url; }
          else { y[k] = d ? d.url : ''; v = y[k]; }
        } else if(c[2] === 'docs'){
          y[k] = [].map.call(m.el.querySelectorAll('[data-docs] [data-dcc]'), function(b){
            var pr = b.querySelector('[data-doc]').dataset.doc, dd = lireDoc(b, pr); if(!dd) return null;
            var type = val(b, 'type');
            return {type:type, titre:val(b, 'titre') || TYPES_DOC.filter(function(t){ return t[0] === type; })[0][1], taille:dd.taille, url:dd.url};
          }).filter(Boolean);
          v = 'ok';
        } else if(c[2] === 'etapes'){
          y[k] = val(m.el, k).split('\n').map(function(l){ var p = l.split('='); return p.length > 1 ? [p[0].trim(), p.slice(1).join('=').trim()] : null; }).filter(Boolean); v = y[k].length ? 'ok' : '';
        } else if(c[2] === 'images'){
          y[k] = val(m.el, k).split('\n').map(function(l){ return l.trim(); }).filter(Boolean); v = 'ok';
        } else { v = val(m.el, k); y[k] = v; }
        if(c[3] && !v) manque.push(c[1].toLowerCase());
      });
      if(manque.length){ toast('À compléter : ' + manque.join(', ')); return; }
      if(C.parDate){
        y.id = y.date;
        if(listeCol(ES, cle).some(function(s, n){ return s.id === y.id && n !== index; })){ toast('Une séance existe déjà à cette date'); return; }
      }
      var avant = copie(D[ES.d]);
      if(index > -1) listeCol(ES, cle)[index] = y ; else listeCol(ES, cle).push(y);
      enregistrer(ES.fichier, avant).then(function(){ m.fermer(); toast('Enregistré'); apres(); }).catch(function(){});
    });
  }

      dates.push(v); dates.sort(); rendreDates(); document.getElementById('encDate').value = '';
    });
    brancherDocs(corps);
    document.getElementById('saveCollectes').addEventListener('click', function(){
      var heures = function(k){ return val(corps, k).split(',').map(function(h){ return h.trim(); }).filter(Boolean); };
      var avant = copie(D.vie);
      D.vie.encombrants = dates.slice();
      var joursListe = function(k){ return val(corps, k).split('\n').map(function(l){ return l.trim(); }).filter(function(l){ return /^\d{4}-\d{2}-\d{2}$/.test(l); }).sort(); };
      D.vie.dechets = Object.assign({}, D.vie.dechets, {calendrierTitre:val(corps, 'calendrierTitre'), calendrier:(lireDoc(corps, 'd-cal') || {}).url || '', demetox:(lireDoc(corps, 'd-demetox') || {}).url || '',
        demetoxDates:joursListe('demetoxDates'), mobileEaubonne:joursListe('mobileDates')});
      D.vie.rendezvous = {semaine:heures('rdvSemaine'), samedi:heures('rdvSamedi')};
      enregistrer('vie-municipale', avant).then(function(){ toast('Réglages enregistrés'); }).catch(function(){});
    });
  }

  /* ============================================================
     DEMANDES DE RENDEZ-VOUS (data/demandes.json, via le serveur)
     ============================================================ */
  var STATUTS = {nouvelle:['Nouvelle','#2563eb','rgba(59,130,246,.13)'], confirmee:['Confirmée','#15803d','rgba(34,197,94,.14)'], refusee:['Refusée','#b91c1c','rgba(239,68,68,.12)'], traitee:['Traitée','#475569','rgba(11,26,36,.07)']};
  var TYPES_DEM = {
    maire:{nom:'Rendez-vous avec le Maire', court:'RDV Maire', c:['#fb923c','#c2410c'], sujet:'Votre rendez-vous avec le Maire de Margency',
      corps:function(d){ return 'Nous vous confirmons votre rendez-vous avec Monsieur le Maire le '+jourSemaine(d.date)+' '+dateTexte(d.date)+' à '+d.creneau+', en mairie (5 avenue Georges-Pompidou).\n\nCordialement,\nLe secrétariat du Maire\n01 34 27 40 40'; }},
    salle:{nom:'Réservation de salle', court:'Salle', c:['#fbbf6b','#b45309'], sujet:'Votre demande de réservation de salle',
      corps:function(d){ return 'Nous avons bien reçu votre demande pour la '+d.objet.toLowerCase()+' le '+jourSemaine(d.date)+' '+dateTexte(d.date)+' ('+d.creneau.toLowerCase()+').\n\nLa salle est disponible à cette date. Vous trouverez ci-joint le devis ; la réservation sera validée après le paiement des arrhes, dans les 8 jours suivant sa réception.\n\nCordialement,\nLe service location des salles\n01 34 27 40 41'; }},
    message:{nom:'Message', court:'Message', c:['#60a5fa','#2563eb'], sujet:'',
      corps:function(d){ return '\n\n\nCordialement,\nMairie de Margency\n01 34 27 40 40'; }}
  };
  function jourSemaine(iso){ return ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'][new Date(iso + 'T12:00:00').getDay()]; }
  function vueDemandes(){
    app.innerHTML = '<div class="view">'+enTete('Demandes des habitants', 'Rendez-vous, salles et messages', 'Tout ce qui arrive depuis les formulaires du site : rendez-vous avec le Maire, réservations de salle et messages « Écrire à la mairie ».')+'<div id="dem"><div class="vide glass">Chargement…</div></div></div>';
    var zone = document.getElementById('dem');
    if(!serveurOk){ zone.innerHTML = '<div class="vide glass">Les demandes sont disponibles quand le serveur de gestion est lancé.</div>'; return; }
    var filtre = sessionStorage.getItem('g-dem') || 'a-traiter', type = sessionStorage.getItem('g-dem-type') || 'tous';
    function charger(){
      fetch('/api/demandes', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
        var l = j.demandes.map(function(d){ d.type = TYPES_DEM[d.type] ? d.type : 'maire'; return d; });
        var a = l.filter(function(d){ return d.statut === 'nouvelle'; });
        majBadge(a.length);
        var vis = l.filter(function(d){ return (type === 'tous' || d.type === type) && (filtre === 'toutes' || (filtre === 'a-traiter' ? d.statut === 'nouvelle' : d.statut !== 'nouvelle')); });
        zone.innerHTML = '<div class="outils"><div class="filtre glass">'+[['a-traiter','À traiter · '+a.length],['traitees','Traitées'],['toutes','Toutes · '+l.length]].map(function(f){
            return '<button data-f="'+f[0]+'" class="'+(f[0] === filtre ? 'on' : '')+'">'+f[1]+'</button>'; }).join('')+'</div>'+
          '<div class="filtre glass">'+[['tous','Tous types']].concat(Object.keys(TYPES_DEM).map(function(k){ return [k, TYPES_DEM[k].court + ' · ' + l.filter(function(d){ return d.type === k && d.statut === 'nouvelle'; }).length]; })).map(function(f){
            return '<button data-ty="'+f[0]+'" class="'+(f[0] === type ? 'on' : '')+'">'+f[1]+'</button>'; }).join('')+'</div></div>'+
          '<div class="liste">'+(vis.length ? vis.map(function(d){
            var s = STATUTS[d.statut] || STATUTS.nouvelle, T = TYPES_DEM[d.type];
            var corps = encodeURIComponent('Bonjour '+d.prenom+' '+d.nom+',\n\n'+T.corps(d));
            var sujet = encodeURIComponent(T.sujet || 'Re : ' + d.objet);
            var pastille = d.date ? datePastille(d.date) : '<span class="pastille sm" style="--c1:'+T.c[0]+';--c2:'+T.c[1]+'">'+ico('mail')+'</span>';
            return '<div class="ligne glass" style="grid-template-columns:auto minmax(0,1fr) auto;align-items:start">'+pastille+
              '<div><h3>'+esc(d.prenom+' '+d.nom)+'<span class="badge" style="color:'+T.c[1]+';background:rgba(11,26,36,.06)">'+T.court+'</span><span class="badge" style="color:'+s[1]+';background:'+s[2]+'">'+s[0]+'</span></h3>'+
                '<small>'+(d.type === 'message' ? 'Pour : '+esc(d.creneau)+' · « '+esc(d.objet)+' »' : esc(d.objet)+' · '+esc(d.creneau)+(d.date ? ' · '+esc(jourSemaine(d.date)+' '+dateTexte(d.date)) : ''))+'</small>'+
                '<small>Reçue le '+esc(dateTexte(d.recue.slice(0,10)))+' à '+esc(d.recue.slice(11))+' · <a class="lnk" href="mailto:'+esc(d.email)+'">'+esc(d.email)+'</a>'+(d.telephone ? ' · '+esc(d.telephone) : '')+'</small>'+
                (d.message ? '<p style="font-size:.88rem;color:var(--ink-soft);margin-top:.5rem;white-space:pre-wrap">'+esc(d.message)+'</p>' : '')+
                '<div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.7rem">'+
                  (d.type !== 'message' && d.statut !== 'confirmee' ? '<button class="btn btn-solid btn-sm" data-st="confirmee" data-id="'+d.id+'">'+ico('check')+'Confirmer</button>' : '')+
                  '<a class="btn btn-glass btn-sm" href="mailto:'+esc(d.email)+'?subject='+sujet+'&body='+corps+'">'+ico('mail')+'Répondre</a>'+
                  (d.type !== 'message' && d.statut !== 'refusee' ? '<button class="btn btn-glass btn-sm" data-st="refusee" data-id="'+d.id+'">Refuser</button>' : '')+
                  (d.statut !== 'traitee' ? '<button class="btn btn-glass btn-sm" data-st="traitee" data-id="'+d.id+'">Marquer traitée</button>' : '')+
                '</div></div>'+
              '<div class="actions"><button class="ib del" data-del="'+d.id+'" title="Supprimer">'+ico('trash')+'</button></div></div>';
          }).join('') : '<div class="vide glass">Aucune demande ici.</div>')+'</div>';
      }).catch(function(){ zone.innerHTML = '<div class="vide glass">Impossible de charger les demandes.</div>'; });
    }
    zone.addEventListener('click', function(e){
      var f = e.target.closest('[data-f]'); if(f){ filtre = f.dataset.f ; sessionStorage.setItem('g-dem', filtre); return charger(); }
      var t = e.target.closest('[data-ty]'); if(t){ type = t.dataset.ty ; sessionStorage.setItem('g-dem-type', type); return charger(); }
      var b = e.target.closest('[data-st],[data-del]'); if(!b) return;
      var envoyer = function(corps){ return fetch('/api/demande-statut', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(corps)}).then(charger); };
      if(b.dataset.del) confirmer('Supprimer cette demande ?', 'Les coordonnées de la personne seront effacées définitivement.').then(function(){ envoyer({id:b.dataset.del, supprimer:true}).then(function(){ toast('Demande supprimée'); }); });
      else envoyer({id:b.dataset.id, statut:b.dataset.st}).then(function(){ toast('Statut mis à jour'); });
    });
    charger();
  }
  function majBadge(n){
    var t = document.querySelector('.tab[data-tab="demandes"] span'); if(!t) return;
    t.innerHTML = 'Demandes' + (n ? ' <b style="display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 .3rem;border-radius:9px;background:#c81e1e;color:#fff;font-size:.68rem">'+n+'</b>' : '');
  }

  /* ============================================================
     NAVIGATION
     ============================================================ */
  var ONGLETS = [['accueil','grid','Tableau de bord'],['ecran','home','Écran d\'accueil'],['agenda','cal','Agenda'],['actus','chat','Actualités'],['conseil','hall','Conseil municipal'],['ccas','hands','CCAS'],['vie','hall','Vie municipale'],['enfance','cap','Enfance'],['culture','music','Sport & Culture'],['vivre','home','Vivre'],['urbanisme','map','Urbanisme'],['demandes','mail','Demandes'],['cartes','link','Cartes & liens'],['services','list','Services'],['site','eye','Voir le site']];
  document.getElementById('tabs').innerHTML = ONGLETS.map(function(o){
    return o[0] === 'site' ? '<a class="tab" href="index.html" target="_blank" rel="noopener">'+ico(o[1])+'<span>'+o[2]+'</span></a>'
      : '<a class="tab" data-tab="'+o[0]+'" href="#'+o[0]+'">'+ico(o[1])+'<span>'+o[2]+'</span></a>';
  }).join('');


  /* ============ écran d'accueil : les informations importantes ============ */
  function infosAccueil(){
    if(!D.accueil || typeof D.accueil !== 'object') D.accueil = {infos:[]};
    if(!Array.isArray(D.accueil.infos)) D.accueil.infos = [];
    return D.accueil.infos;
  }
  function etatInfo(i){
    if(i.debut && i.debut > TODAY) return ['a-venir', 'programmée pour le ' + dateTexte(i.debut)];
    if(i.fin && i.fin < TODAY)     return ['passe',   'terminée le ' + dateTexte(i.fin)];
    if(i.fin)                      return ['en-cours', "à l'écran jusqu'au " + dateTexte(i.fin)];
    return ['en-cours', "à l'écran en permanence"];
  }

  function vueEcranListe(){
    var infos = infosAccueil();
    var visibles = infos.filter(function(i){ return etatInfo(i)[0] === 'en-cours'; }).length;
    app.innerHTML = '<div class="view">'+
      enTete("Écran d'accueil", 'Les informations importantes',
        "Elles s'affichent dans l'encadré, à droite de la photo de la mairie. Sans information active, aucun encadré n'apparaît : on ne voit que la photo.",
        '<div style="display:flex;gap:.5rem;flex-wrap:wrap">'+
          '<a class="btn btn-glass" href="index.html" target="_blank" rel="noopener">'+ico('eye')+'Voir le site</a>'+
          boutonAjout('#ecran/nouvelle', 'Ajouter une information')+'</div>')+
      '<div class="bandeau glass" style="margin-bottom:14px">'+ico('info')+
        '<span>'+(visibles ? '<b>'+visibles+'</b> information'+(visibles > 1 ? 's' : '')+' actuellement à l\'écran.'
                           : 'Aucune information à l\'écran : les visiteurs voient la photo seule.')+'</span></div>'+
      '<label class="field" style="max-width:460px;margin-bottom:16px"><span>Titre de l\'encadré</span>'+
        '<input id="ecranTitre" value="'+esc(D.accueil.titre || '')+'" placeholder="À retenir">'+
        '<small>Le petit intitulé au-dessus des informations. Laissé vide, « À retenir » est utilisé.</small></label>'+
      '<div class="liste">'+(infos.length ? infos.map(function(i, n){
        var e = etatInfo(i);
        return '<div class="ligne glass">'+
          '<span class="pastille sm" style="--c1:'+(e[0] === 'en-cours' ? '#14b8a6' : e[0] === 'a-venir' ? '#60a5fa' : '#94a3b8')+';--c2:'+
            (e[0] === 'en-cours' ? '#0f766e' : e[0] === 'a-venir' ? '#2563eb' : '#475569')+'">'+ico('info')+'</span>'+
          '<div><h3>'+esc(i.titre)+(e[0] === 'en-cours' ? '<span class="badge">à l\'écran</span>' : '<span class="badge passe">'+(e[0] === 'a-venir' ? 'programmée' : 'terminée')+'</span>')+'</h3>'+
            '<small>'+esc(e[1])+(i.lien ? ' · → ' + esc(i.lien) : '')+'</small></div>'+
          '<div class="actions">'+
            '<button class="ib" data-haut="'+n+'" title="Monter"'+(n === 0 ? ' disabled' : '')+'>'+ico('back').replace('M19 12H5M11 18l-6-6 6-6','M12 19V5M6 11l6-6 6 6')+'</button>'+
            '<button class="ib" data-bas="'+n+'" title="Descendre"'+(n === infos.length - 1 ? ' disabled' : '')+'>'+ico('back').replace('M19 12H5M11 18l-6-6 6-6','M12 5v14M6 13l6 6 6-6')+'</button>'+
            '<button class="ib" data-modif="'+n+'" title="Modifier">'+ico('pen')+'</button>'+
            '<button class="ib del" data-sup="'+n+'" title="Supprimer">'+ico('trash')+'</button></div></div>';
      }).join('') : '<div class="vide glass">Aucune information pour l\'instant. Les visiteurs voient la photo de la mairie, sans encadré.</div>')+'</div></div>';

    var champTitre = app.querySelector('#ecranTitre');
    champTitre.addEventListener('change', function(){
      var avant = copie(D.accueil);
      D.accueil.titre = champTitre.value.trim();
      enregistrer('accueil', avant).then(function(){ toast('Titre de l\'encadré enregistré'); }).catch(function(){});
    });

    app.querySelector('.liste').addEventListener('click', function(ev){
      var b = ev.target.closest('button'); if(!b || b.disabled) return;
      if(b.dataset.modif != null){ location.hash = 'ecran/' + b.dataset.modif; return; }
      var avant = copie(D.accueil), L = infosAccueil();
      if(b.dataset.sup != null){
        var i = L[+b.dataset.sup];
        confirmer('Supprimer « '+esc(i.titre)+' » ?', "L'information disparaîtra de l'écran d'accueil.").then(function(){
          L.splice(+b.dataset.sup, 1);
          enregistrer('accueil', avant).then(function(){ toast('Information supprimée'); route(); }).catch(route);
        });
        return;
      }
      var de = b.dataset.haut != null ? +b.dataset.haut : +b.dataset.bas;
      var vers = b.dataset.haut != null ? de - 1 : de + 1;
      L.splice(vers, 0, L.splice(de, 1)[0]);
      enregistrer('accueil', avant).then(route).catch(route);
    });
  }

  function vueEcranForm(id){
    var nouvelle = id === 'nouvelle';
    var L = infosAccueil();
    var i = nouvelle ? {titre:'', texte:'', debut:'', fin:'', lien:'', libelle:''} : L[+id];
    if(!i) return vueEcranListe();

    app.innerHTML = '<div class="view">'+
      enTete("Écran d'accueil", nouvelle ? 'Nouvelle information' : 'Modifier l\'information',
        "Seul le titre est obligatoire. Une information sans date reste affichée jusqu'à ce que vous la retiriez.")+
      '<div class="form"><div>'+
        '<div class="carte-f glass"><h2><i>1</i>Le message</h2>'+
          champ('Titre <b style="color:var(--danger)">*</b>', inp('titre', i.titre, 'placeholder="Ex. : Coupure d\'eau mardi 14 octobre"'))+
          champ('Précision', txt('texte', i.texte, 'placeholder="Une ou deux phrases. Rue concernée, horaires, qui contacter…"'),
            'Facultatif. Gardez-le court : l\'encadré est lu en un coup d\'œil.')+
        '</div>'+
        '<div class="carte-f glass"><h2><i>2</i>Période d\'affichage</h2>'+
          '<div class="grid-2">'+
            champ('À partir du', inp('debut', i.debut, 'type="date"'), 'Vide : tout de suite.')+
            champ('Jusqu\'au', inp('fin', i.fin, 'type="date"'), 'Vide : jusqu\'à ce que vous la retiriez.')+
          '</div>'+
          '<p class="aide">L\'information apparaît et disparaît toute seule aux dates indiquées. Une information terminée reste ici, mais n\'est plus visible sur le site.</p>'+
        '</div>'+
      '</div><div>'+
        '<div class="carte-f glass"><h2><i>3</i>Lien</h2>'+
          champLien('lien', i.lien, true)+
          champ('Texte du lien', inp('libelle', i.libelle, 'placeholder="En savoir plus"'), 'Laissé vide, « En savoir plus » est utilisé.')+
        '</div>'+
      '</div></div>'+
      barreBas(nouvelle ? 'Nouvelle information' : 'Modification en cours', 'index.html')+'</div>';

    brancherLiens(app);
    app.querySelector('[data-annuler]').addEventListener('click', function(ev){ ev.preventDefault(); location.hash = 'ecran'; });
    app.querySelector('[data-enregistrer]').addEventListener('click', function(){
      if(!exiger(app, [['titre', 'le titre']])) return;
      var avant = copie(D.accueil);
      var x = nouvelle ? {} : L[+id];
      x.titre = val(app, 'titre'); x.texte = val(app, 'texte');
      x.debut = val(app, 'debut'); x.fin = val(app, 'fin');
      x.lien = lireLien(app, 'lien'); x.libelle = val(app, 'libelle');
      if(nouvelle) L.push(x);
      enregistrer('accueil', avant)
        .then(function(){ toast(nouvelle ? 'Information ajoutée' : 'Information modifiée'); location.hash = 'ecran'; })
        .catch(function(){});
    });
  }

  function route(){
    var h = location.hash.replace('#', '').split('/'), v = h[0] || 'accueil', id = h[1];
    document.querySelectorAll('.tab[data-tab]').forEach(function(t){ t.classList.toggle('on', t.dataset.tab === v); });
    var nouvelApp = app.cloneNode(false); app.parentNode.replaceChild(nouvelApp, app); app = nouvelApp;   /* repart sans écouteurs */
    window.scrollTo(0, 0);
    switch(v){
      case 'ecran':    return id ? vueEcranForm(id) : vueEcranListe();
      case 'agenda':   return id ? vueAgendaForm(id) : vueAgendaListe();
      case 'actus':    return id ? vueActusForm(id) : vueActusListe();
      case 'conseil':  return id ? vueConseilForm(id) : vueConseilListe();
      case 'ccas':     return id ? vueCcasForm(id) : vueCcasListe();
      case 'cartes':   return vueCartes(id);
      case 'services': return vueServices(id);
      case 'vie':      return vueVie(id);
      case 'enfance':  return vueEspace('enfance', id);
      case 'culture':  return vueEspace('culture', id);
      case 'vivre':    return vueEspace('vivre', id);
      case 'urbanisme':return vueEspace('urbanisme', id);
      case 'demandes': return vueDemandes();
      default:         return vueAccueil();
    }
  }
  window.addEventListener('hashchange', route);
  MD.chrome();
  verifierServeur().then(function(){
    route();
    if(serveurOk && location.hash.replace('#', '') && location.hash !== '#accueil') fetch('/api/demandes', {cache:'no-store'}).then(function(r){ return r.json(); })
      .then(function(j){ majBadge(j.demandes.filter(function(d){ return d.statut === 'nouvelle'; }).length); }).catch(function(){});
  });
})();
</script>
</body>
</html>
